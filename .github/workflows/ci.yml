name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:   # ручной запуск: Actions → ci → Run workflow

jobs:
  ci:
    uses: ResistVPNservice/ci-templates/.github/workflows/python-library.yml@v1
    secrets: inherit
    permissions:
      contents: write   # job release создаёт GitHub Release по тегу
