[project]
name = "quantum-common"
version = "0.1.0"
description = "QuantumVPN: контракты событий, БД, outbox/inbox, Kafka, настройки"
requires-python = ">=3.12"
dependencies = [
    "faststream[kafka]>=0.7,<0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantum_common"]
